<div class="container mt-5">

  <form (ngSubmit)='addPost()' class="w-50 m-auto" method="Post">

    <div class="mb-3">
      <label for="Author" class="form-label">Author</label>
      <input type="text" class="form-control" [(ngModel)]="Data.author_name" name='author_name' id=" Author">

      @if (submitted && !Data.author_name.trim()) {
      <p class="alert alert-danger mt-2">
        author name is required.
      </p>
      }
    </div>
    <div class="mb-3">
      <label for="Title" class="form-label">Title</label>
      <input type="text" class="form-control" [(ngModel)]="Data.title" name='title' id=" Title">
      @if (submitted && !Data.title.trim()) {
      <p class="alert alert-danger mt-2">
        title is required.
      </p>
      }
    </div>
    <div class="mb-3">
      <label for="Body" class="form-label">Body</label>
      <textarea rows="5" [(ngModel)]="Data.body" class="form-control" name='body' id=" Body"></textarea>

      @if (submitted && !Data.body.trim()) {
      <p class="alert alert-danger mt-2">
        body is required.
      </p>
      }
    </div>

    <button type="submit" class="btn btn-success w-100">Add</button>
  </form>
