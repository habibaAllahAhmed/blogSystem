<div class="container mt-5">
  <div class="row">
    <div class="col-lg-12">
      <div class="container mt-5">
        <a routerLink="/addPost" class="btn btn-success w-100 mb-4">
          Create New Post
        </a>

        <div class="row">
          @for (post of posts(); track $index) {
          <div class="col-lg-12 mb-3 ">
            <app-post [post]="post" (deletedPost)="deletePost($event)" (restoredPost)="restorePost($event)"
              (forceDeletedPost)="forceDeletePost($event)" [operations]="true"></app-post>
          </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
